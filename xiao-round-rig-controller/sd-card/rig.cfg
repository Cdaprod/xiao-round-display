# CDAProd XIAO Round Rig Controller
# Copy this file to the ROOT of a FAT32 microSD card as /rig.cfg.

wifi_ssid=cda_Lab
wifi_password=CHANGE_ME

# Current media-sync authority. Do not include a trailing slash.
api_base=http://192.168.0.25:8787

# This must equal the node_id owning the active camera live session.
node_id=CHANGE_ME_CAMERA_NODE_ID

# Device token issued to that node by POST /connect/register.
# The current /api/live_sessions/{session_id}/control route requires the
# active session owner's Bearer token and X-Media-Sync-Node-Id header.
bearer_token=CHANGE_ME_DEVICE_TOKEN

poll_ms=1000

