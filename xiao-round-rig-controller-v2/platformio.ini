[platformio]
default_envs = seeed_xiao_esp32s3

[env:seeed_xiao_esp32s3]
platform = espressif32 @ 6.12.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1
    -DRIG_ENABLE_DMA=1
    -DRIG_LCD_SPI_HZ=80000000
    -DRIG_HALO_TARGET_FPS=60
    -O3
lib_deps =
    moononournation/GFX Library for Arduino @ 1.6.4
    bblanchon/ArduinoJson @ 7.4.2

[env:seeed_xiao_esp32s3_compat]
extends = env:seeed_xiao_esp32s3
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1
    -DRIG_ENABLE_DMA=0
    -DRIG_LCD_SPI_HZ=40000000
    -DRIG_HALO_TARGET_FPS=45
    -O2
